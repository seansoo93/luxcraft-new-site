name: Deploy Website to SPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync to SPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check contact handler syntax
        run: |
          php -l contact-submit.php
          python3 -m unittest discover -s tests -v

      - name: Deploy via FTPS
        id: deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.zip
            **/*.tar.gz
            **/logs/**
            **/scratch/**
            **/tests/**
            **/scripts/**
            **/mail-diagnostics.php
            **/*.log
            **/.luxcraft-private/**

      - name: Remove retired diagnostics from hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_CA_CERT: ${{ secrets.FTP_CA_CERT }}
        run: python3 scripts/remove-mail-diagnostics.py

      - name: Verify private routes are blocked
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: python3 scripts/check-contact-privacy.py
